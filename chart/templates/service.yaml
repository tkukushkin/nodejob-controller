apiVersion: v1
kind: Service
metadata:
  name: {{ include "nodejob-controller.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodejob-controller.labels" . | nindent 4 }}
spec:
  ports:
  - name: metrics
    port: 8080
    protocol: TCP
    targetPort: metrics
  selector:
    {{- include "nodejob-controller.selectorLabels" . | nindent 4 }}
