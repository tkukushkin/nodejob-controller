apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodejob-controller.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodejob-controller.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
# The ClusterRole it binds is generated from the +kubebuilder:rbac markers into role.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nodejob-controller.name" . }}
  labels:
    {{- include "nodejob-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nodejob-controller.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "nodejob-controller.name" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nodejob-controller.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodejob-controller.labels" . | nindent 4 }}
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nodejob-controller.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodejob-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nodejob-controller.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "nodejob-controller.name" . }}
  namespace: {{ .Release.Namespace }}
