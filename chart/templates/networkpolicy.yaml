{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nodejob-controller.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodejob-controller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nodejob-controller.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: metrics
      protocol: TCP
    - port: health
      protocol: TCP
  egress:
  {{- if .Values.networkPolicy.egress }}
  {{- toYaml .Values.networkPolicy.egress | nindent 2 }}
  {{- else }}
  - {}
  {{- end }}
{{- end }}
